<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar WhatsApp — O Próximo Cliente</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:48px auto;padding:0 20px;color:#222}
  button{background:#1877f2;color:#fff;border:0;border-radius:8px;font-size:18px;padding:14px 22px;cursor:pointer}
  button:disabled{opacity:.5}
  pre{background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
  .ok{color:#0a7a2f}.erro{color:#b00020}
</style>
</head>
<body>
<h1>Conectar o WhatsApp em coexistência</h1>
<p>Um clique: abre a janela da Meta, você escolhe o número que já está no WhatsApp Business e lê o QR <strong>dentro do app</strong>. O app do celular continua funcionando; o agente passa a responder por trás.</p>
<button id="btn" disabled>Conectar WhatsApp</button>
<p id="status">Carregando o SDK da Meta…</p>
<pre id="saida" hidden></pre>

<script>
  const APP_ID = "2159128187972575";
  const CONFIG_ID = new URLSearchParams(location.search).get("config") || "COLE_O_CONFIGURATION_ID";
  const st = document.getElementById("status"), out = document.getElementById("saida"), btn = document.getElementById("btn");

  window.fbAsyncInit = function () {
    FB.init({ appId: APP_ID, autoLogAppEvents: true, xfbml: true, version: "v22.0" });
    btn.disabled = false; st.textContent = "Pronto. Clique no botão.";
  };

  // A Meta manda os IDs do número/conta por mensagem quando o fluxo termina.
  window.addEventListener("message", (e) => {
    if (!/facebook\.com$/.test(new URL(e.origin).hostname)) return;
    try {
      const d = JSON.parse(e.data);
      if (d.type !== "WA_EMBEDDED_SIGNUP") return;
      out.hidden = false;
      if (d.event === "FINISH" || d.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING") {
        st.innerHTML = '<span class="ok">Conectado.</span> Copie os dois IDs abaixo para o Render:';
        out.textContent = "WA_PHONE_NUMBER_ID = " + (d.data.phone_number_id || "?") + "\nWABA_ID = " + (d.data.waba_id || "?");
      } else if (d.event === "CANCEL") {
        st.innerHTML = '<span class="erro">Cancelado</span> na tela: ' + (d.data.current_step || "?");
      } else if (d.event === "ERROR") {
        st.innerHTML = '<span class="erro">Erro:</span> ' + (d.data.error_message || "?");
      }
    } catch { /* mensagens que não são JSON não interessam */ }
  });

  btn.onclick = () => {
    FB.login((r) => {
      if (r.authResponse && r.authResponse.code) {
        out.hidden = false;
        out.textContent += "\nCODE (troca por token no servidor, vale 30 s): " + r.authResponse.code;
      } else st.innerHTML = '<span class="erro">Login não concluído.</span>';
    }, {
      config_id: CONFIG_ID,
      response_type: "code",
      override_default_response_type: true,
      extras: { setup: {}, featureType: "whatsapp_business_app_onboarding", sessionInfoVersion: "3" },
    });
  };
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>
</body>
</html>
