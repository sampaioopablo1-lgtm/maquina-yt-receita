canal:
  nome: "Setiap Level"
  handle: "@SetiapLevelID"          # https://www.youtube.com/@SetiapLevelID
  idioma: "id"                      # indonesio
  tema: "dinheiro, trabalho, status e decisoes"
  publico_infantil: false
  categoria_id: "22"                # People & Blogs
  estilo_narracao: "direto, calmo, com autoridade; frases curtas"
  idioma_revisao: "pt-BR"           # traducao de roteiros e comentarios na revisao
  # Palavras-chave extraidas de 144 videos dos canais de referencia do subnicho
  # (Raymond Chin, Grind Theory, Finance Clipper), ponderadas por views/dia.
  # Base do pilar 1. Reveja com `maquina pesquisar` a cada 2-3 meses.
  referencias_titulo:
    - "kenapa"          # por que — abre pergunta provocativa
    - "kok bisa"        # como pode — paradoxo
    - "orang kaya"      # pessoa rica
    - "orang miskin"    # pessoa pobre
    - "mental miskin"   # mentalidade pobre
    - "mindset"
    - "gaji"            # salario
    - "kerja"           # trabalho
    - "karyawan"        # empregado
    - "karier"          # carreira
    - "dipecat"         # demitido
    - "cari kerja"      # procurar emprego
    - "uang"            # dinheiro
    - "skill"
    - "alasan"          # razao
    - "realita"         # realidade
    - "indonesia"
    # Definidas por voce nas configuracoes do canal — nao apareceram na
    # pesquisa, mas sao intencionais e delimitam o posicionamento.
    - "kelas sosial"       # classe social
    - "biaya hidup"        # custo de vida
    - "keuangan pribadi"   # financas pessoais
    - "pendapatan"         # renda
    - "gaya hidup"         # estilo de vida
    - "ekonomi indonesia"

  # Eixos rotacionados a cada video, derivados dos padroes que de fato
  # performam no nicho — nao inventados. Em ritmo diario, e o que impede
  # 30 videos/mes de convergirem para o mesmo formato.
  eixos_tematicos:
    - "pergunta provocativa: kenapa X acontece"
    - "paradoxo: tem X mas continua Y"
    - "alerta de risco iminente para quem faz X"
    - "comparacao entre duas escolhas de carreira"
    - "realidade dura desmontada com dados"
    - "habilidade ou metodo pratico que muda o jogo"
    - "geracao ou grupo social sob analise"

# Os 3 pilares viram numero. Ver docs/02-playbook-youtube.md
metas:
  ctr_min: 0.05
  ctr_bom: 0.08
  retencao_min_pct: 30.0

# Barreiras anti-spam. Ver docs/03-compliance-monetizacao.md
# Ritmo diario: teto de 3/dia (a cota da API permite ~6 uploads/dia).
# Similaridade mais rigorosa que o padrao porque volume alto converge sozinho.
publicacao:
  max_por_dia: 3
  similaridade_max: 0.65
  janela_similaridade: 30
  exigir_revisao: true              # NAO desligue sem ler o doc de compliance

# auto: usa a primeira chave disponivel — Anthropic > Gemini (free tier,
# aistudio.google.com) > OpenAI. Sem nenhuma, cai no stub offline.
llm_provider: "auto"
# modal: narracao AUTOMATICA e gratuita — o mesmo Chatterbox indonesio, como
# servico serverless que o Actions chama sozinho (free tier US$30/mes do Modal
# cobre o ritmo diario). Setup unico: infra/modal_tts.py. Docs: 09-voz-gratuita.md
# Alternativas: lote (Colab manual) | fish (~US$0,12/video) | elevenlabs | stub.
tts_provider: "modal"
image_provider: "openai"
llm_model: "claude-sonnet-4-5"
tts_model: "eleven_multilingual_v2"   # usado apenas se tts_provider=elevenlabs
image_model: "gpt-image-1"
