<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:900;src:url("FONT900") format("woff2");}
@font-face{font-family:M;font-weight:800;src:url("FONT800") format("woff2");}
html,body{margin:0;width:WPX;height:HPX;overflow:hidden;background:#111827;font-family:M;}
*{box-sizing:border-box;}
#glow{position:absolute;width:1300px;height:1300px;border-radius:50%;left:-300px;top:GLOWTOP;
  background:radial-gradient(circle,rgba(29,78,216,.55) 0%,rgba(29,78,216,0) 65%);}
#grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#fff 2px,transparent 2px),linear-gradient(90deg,#fff 2px,transparent 2px);background-size:110px 110px;}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 80px;gap:34px;text-align:center;}
.top{display:flex;gap:16px;align-items:center;}
.brand{background:#1D4ED8;color:#fff;font-weight:900;font-size:40px;padding:12px 28px;border-radius:18px;}
.handle{color:#fff;opacity:.8;font-weight:800;font-size:34px;}
.tag{display:inline-block;background:#22C55E;color:#0b1220;font-weight:900;font-size:40px;padding:12px 30px;border-radius:999px;}
h1{margin:0;color:#fff;font-weight:900;font-size:HSIZE;line-height:1.02;text-transform:uppercase;letter-spacing:-2px;}
h1 .k{color:#3B82F6;}
h1 .b{background:#1D4ED8;color:#fff;padding:0 18px;border-radius:20px;}
.sub{color:#E5E7EB;font-weight:800;font-size:46px;line-height:1.25;max-width:900px;}
.card{background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.14);border-radius:30px;padding:30px 34px;width:100%;text-align:left;}
.it{display:flex;align-items:center;gap:22px;color:#fff;font-weight:900;font-size:48px;margin:14px 0;}
.ck{flex:0 0 58px;height:58px;border-radius:50%;background:#22C55E;color:#0b1220;display:flex;align-items:center;justify-content:center;font-size:36px;}
.bub{border-radius:26px;padding:18px 26px;font-weight:800;font-size:34px;line-height:1.25;margin:10px 0;max-width:88%;}
.me{background:#1D4ED8;color:#fff;margin-left:auto;}
.ai{background:#F3F4F6;color:#111827;}
.lab{font-size:26px;opacity:.7;font-weight:800;margin-bottom:6px;}
.cta{display:inline-flex;align-items:center;gap:16px;background:#fff;color:#111827;font-weight:900;font-size:46px;padding:24px 46px;border-radius:22px;}
.price{color:#fff;font-weight:800;font-size:38px;opacity:.85;}
.num{position:absolute;top:44px;right:56px;color:#fff;opacity:.6;font-weight:800;font-size:32px;}
.swipe{color:#3B82F6;font-weight:900;font-size:40px;}
.big{color:#fff;font-weight:900;font-size:64px;line-height:1.1;}
.pasos{display:flex;flex-direction:column;gap:22px;width:100%;}
.ps{display:flex;gap:26px;align-items:center;background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.14);border-radius:26px;padding:24px 30px;text-align:left;}
.ps .n{flex:0 0 84px;height:84px;border-radius:50%;background:#1D4ED8;color:#fff;font-weight:900;font-size:48px;display:flex;align-items:center;justify-content:center;}
.ps .t{color:#fff;font-weight:900;font-size:44px;line-height:1.15;}
.ps .t small{display:block;font-weight:800;font-size:32px;opacity:.75;margin-top:4px;}
.barras{width:100%;display:flex;flex-direction:column;gap:26px;text-align:left;}
.br .r{color:#fff;font-weight:800;font-size:38px;margin-bottom:10px;}
.br .tr{height:100px;background:rgba(255,255,255,.07);border-radius:18px;overflow:hidden;}
.br .f{height:100%;border-radius:18px;display:flex;align-items:center;justify-content:flex-end;padding:0 26px;color:#fff;font-weight:900;font-size:54px;}
.seta{color:#fff;font-weight:900;font-size:44px;background:#22C55E;color:#0b1220;padding:16px 34px;border-radius:999px;}
.row{display:flex;gap:60px;align-items:center;text-align:left;}
.emoji{font-family:"Noto Color Emoji";font-size:150px;line-height:1;}
</style></head>
<body><div id="grid"></div><div id="glow"></div><div id="wrap">CONTEUDO</div></body></html>
