<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:900;src:url("FONT900") format("woff2");}
@font-face{font-family:M;font-weight:800;src:url("FONT800") format("woff2");}
html,body{margin:0;width:1080px;height:HPX;overflow:hidden;font-family:M;}
*{box-sizing:border-box;}
/* por do sol de cidade de praia: roxo -> magenta -> laranja (paleta de referencia, sem logo nem arte do jogo) */
#ceu{position:absolute;inset:0;background:linear-gradient(180deg,#14061f 0%,#3b0f4f 30%,#a3206f 58%,#ff5a7a 76%,#ffae4d 100%);}
#sol{position:absolute;left:50%;transform:translateX(-50%);bottom:SOLB;width:760px;height:760px;border-radius:50%;
  background:linear-gradient(180deg,#ffe066 0%,#ff8a3d 55%,#ff3e7f 100%);opacity:.9;
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 46px,transparent 46px 60px);}
#mar{position:absolute;left:0;right:0;bottom:0;height:MARH;background:linear-gradient(180deg,#1b0b33,#07030f);}
#mar:before{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(90deg,#ff4fd8 2px,transparent 2px),linear-gradient(#ff4fd8 2px,transparent 2px);background-size:90px 46px;}
.palma{position:absolute;bottom:MARH;font-family:"Noto Color Emoji";font-size:300px;line-height:1;filter:brightness(0) saturate(100%);opacity:.92;}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 70px;gap:34px;text-align:center;}
.top{display:flex;gap:16px;align-items:center;}
.brand{background:#ff2e88;color:#fff;font-weight:900;font-size:40px;padding:12px 28px;border-radius:14px;}
.handle{color:#fff;font-weight:800;font-size:34px;text-shadow:0 3px 0 #000;}
.tag{display:inline-block;background:#00e5d4;color:#14061f;font-weight:900;font-size:40px;padding:10px 30px;border-radius:8px;transform:rotate(-2deg);}
h1{margin:0;color:#fff;font-weight:900;font-size:HSIZE;line-height:.98;text-transform:uppercase;letter-spacing:-2px;
  text-shadow:0 6px 0 #000,0 0 40px rgba(0,0,0,.45);}
h1 .k{background:linear-gradient(180deg,#ffe066,#ff6a3d 55%,#ff2e88);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 6px 0 #000);}
.sub{color:#fff;font-weight:800;font-size:46px;line-height:1.22;max-width:920px;text-shadow:0 3px 0 #000;}
.paineis{display:flex;gap:22px;justify-content:center;}
.p{width:290px;height:300px;border:8px solid #000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.5);}
.p:nth-child(1){transform:rotate(-4deg);background:linear-gradient(#ff5a7a,#ff2e88);}
.p:nth-child(2){transform:rotate(2deg);background:linear-gradient(#00e5d4,#008f9e);}
.p:nth-child(3){transform:rotate(-2deg);background:linear-gradient(#ffb347,#ff6a3d);}
.p .e{font-family:"Noto Color Emoji";font-size:130px;line-height:1;}
.p .t{color:#fff;font-weight:900;font-size:40px;text-transform:uppercase;text-shadow:0 4px 0 #000;margin-top:14px;}
.vs{display:flex;gap:26px;align-items:stretch;}
.box{width:440px;border:8px solid #000;padding:26px 20px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.5);}
.box .r{font-weight:800;font-size:38px;line-height:1.15;}
.box .v{font-weight:900;font-size:68px;white-space:nowrap;line-height:1.05;margin-top:8px;text-shadow:0 5px 0 #000;}
.box .s{font-weight:800;font-size:30px;opacity:.95;margin-top:6px;}
.box.a{background:#2a1240;}
.box.b{background:linear-gradient(#ff2e88,#ff6a3d);transform:rotate(-2deg) scale(1.04);}
.cta{display:inline-flex;align-items:center;gap:16px;background:#fff;color:#14061f;font-weight:900;font-size:46px;padding:22px 46px;border-radius:12px;border:6px solid #000;box-shadow:0 8px 0 #000;}
.price{color:#fff;font-weight:800;font-size:34px;text-shadow:0 3px 0 #000;}
.nota{color:#fff;opacity:.85;font-weight:800;font-size:24px;text-shadow:0 2px 0 #000;}
</style></head>
<body><div id="ceu"></div><div id="sol"></div><div id="mar"></div>
<div class="palma" style="left:-80px">🌴</div><div class="palma" style="right:-70px;transform:scaleX(-1)">🌴</div>
<div id="wrap">CONTEUDO</div></body></html>
