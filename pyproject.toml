[project]
name = "maquina-yt-receita"
version = "0.1.0"
description = "Maquina de criacao, edicao e publicacao automatizada de videos no YouTube"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "rich>=13.7",
    "mcp>=1.2",
    "edge-tts>=7.2.8",   # <7 quebra com NoAudioReceived: o endpoint da Microsoft mudou
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# fabrica/fabrica.py: gerador parametrico de video (fluxo manual, fora da
# pipeline testada em src/maquina) — custo zero, usa TTS gratuito da Microsoft.
fabrica = ["cairosvg>=2.7"]
# Stack de baixo custo: Anthropic (roteiro) + edge-tts (voz) + Pollinations
# (imagens). Voz e imagem sao gratuitas; so o roteiro custa, ~US$ 0,10 por
# pacote. O Gemini virou rede de seguranca em 13/08/2026 — 20 requisicoes/dia
# do free tier nao cabem seis pacotes diarios.
gratuito = []

[project.scripts]
maquina = "maquina.cli:app"
maquina-mcp = "maquina.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercita render real com ffmpeg"]
# `fabrica/` nao e pacote instalado: os modulos la se importam entre si por nome
# simples (`from caminhos import dir_trabalho`). Sem esta linha, qualquer teste
# que carregue `fabrica/publicar.py` por caminho morre na coleta com
# `ModuleNotFoundError: No module named 'caminhos'` — e morria em silencio, nos
# 329 testes de `test_publicar_copy.py`, TAMBEM NO CI, que roda `pytest -v` puro.
#
# Medido em 09/10/2026: a suite reprovava 354 de 2.476, e 329 disso era este
# unico import. Essa e a rede que NAO pegou a remocao do `[:8]` do publicar.py
# em 08/10 — o teste que deveria ter avisado nunca chegou a ser coletado.
pythonpath = ["fabrica", "."]
