[project]
name = "maquina-yt-receita"
version = "0.1.0"
description = "Maquina de criacao, edicao e publicacao automatizada de videos no YouTube"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "rich>=13.7",
    "mcp>=1.2",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# fabrica/fabrica.py: gerador parametrico de video (fluxo manual, fora da
# pipeline testada em src/maquina) — custo zero, usa TTS gratuito da Microsoft.
fabrica = ["cairosvg>=2.7"]
# Stack totalmente gratuita: Gemini (roteiro) + edge-tts (voz) + PIL (imagens).
# Nenhuma chave paga. Unica secret necessaria: GEMINI_API_KEY (aistudio.google.com).
gratuito = []

[project.scripts]
maquina = "maquina.cli:app"
maquina-mcp = "maquina.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercita render real com ffmpeg"]
