name: trafegocomia — pesquisa na Biblioteca de Anuncios

# Le anuncios ATIVOS do Meta Ad Library (publicos) pelo CLI
# @thenavidm/facebook-ad-library-mcp-cli, no runner (a sessao nao alcanca
# o fbcdn). Grava em trafegocomia/pesquisa/bruto e comita no mesmo branch.

on:
  push:
    paths:
      - "trafegocomia/pesquisa/buscas.json"
      - "trafegocomia/pesquisa/coleta.sh"
      - ".github/workflows/trafegocomia-ads.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chromium do Playwright
        run: |
          npm i -g @thenavidm/facebook-ad-library-mcp-cli@latest
          D=$(npm root -g)/@thenavidm/facebook-ad-library-mcp-cli
          (cd "$D" && npx playwright install --with-deps chromium)
          facebook-ad-library-cli doctor || true
      - name: Coletar
        run: bash trafegocomia/pesquisa/coleta.sh
      - name: Comitar
        if: always()
        run: |
          git config user.name "trafegocomia-ads"
          git config user.email "actions@users.noreply.github.com"
          git add trafegocomia/pesquisa/bruto
          git diff --cached --quiet && { echo "nada"; exit 0; }
          git commit -m "trafegocomia: coleta da Biblioteca de Anuncios"
          for t in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((t*5)); done
          exit 1
