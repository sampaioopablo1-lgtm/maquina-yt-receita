name: WeSales - Relatorio de tarefas vencidas

# 01/10: agendamento retirado. Esta rotina nunca concluiu (403 por falta de User-Agent desde 27/09 e, corrigido
# isso, 422: o corpo da busca de tarefas esta errado). As tarefas vencidas ja saem, por tipo, no monitor de hora
# em hora (wesales-monitor.yml -> opc-crm-dados/monitor/ULTIMO.md). Fica so o botao manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overdue-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate read-only report
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: |
          set -o pipefail
          python wesales/tools/report_overdue_tasks.py 2>&1 | tee overdue-tasks-report.json
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: overdue-tasks-report-${{ github.run_id }}
          path: overdue-tasks-report.json
          retention-days: 14

