name: Producao de video

# O motor da maquina. O runner ubuntu-latest ja traz ffmpeg instalado.
# Meta: 10 videos/dia por canal, um eixo tematico diferente por video.
# Cota YouTube API: 100 uploads/dia por projeto (videos.insert tem balde
# proprio). O comentario antigo dizia ~6, vindo de dividir 10.000 unidades por
# 1.600 — conta errada, ver aprendizados #57 e #174.
on:
  schedule:
    # A cada 4h = 6 runs/dia, um canal diferente por run (ver "Escolher canal").
    #
    # Esta cadencia era insustentavel enquanto o padrao era longo: 83 min de
    # runner por video, medidos no run 31619957726, dao ~15.000 min/mes num
    # repositorio privado com 2.000 inclusos. Com o padrao em short — 5 cenas
    # em vez de 78 — o mesmo ritmo cabe folgado no plano gratuito, e o gasto
    # so aparece nos canais que ja provaram que alguem assiste.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato. auto = short, ou longo se o canal ja passou de 300 views num short."
        type: choice
        options: [auto, shorts, longo]
        default: auto
      titulo:
        description: "Titulo especifico (vazio = a maquina escolhe a pauta)"
        type: string
        default: ""
      quantidade:
        description: "Quantos videos produzir neste lote (0 ou vazio = 1)"
        type: string
        default: "1"
      canal:
        description: "Slug do canal (ex: sx-educacao). VAZIO = default.yaml, que e a config do Setiap Level."
        type: string
        default: ""

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    # 83 min medidos para um longo de 13 min (run 31619957726). 300 cobre um
    # lote de tres com folga, ou um video que precise de muita retentativa.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verificar ffmpeg do runner
        run: ffmpeg -version | head -1

      - name: Instalar
        run: pip install -e .

      # Sem este passo o cron nao servia a frota.
      #
      # `inputs.canal` so existe no workflow_dispatch: no evento `schedule` ele
      # vem vazio, o Config.load cai no default.yaml — que NAO e um padrao
      # neutro, e a config do Setiap Level — e as linhas eram gravadas sem
      # canal. Treze canais conectados, e o motor automatico alimentava um.
      #
      # A escolha vem da v_maquina_rodizio, que envolve a v_maquina_fila — a
      # mesma fila que a rotina horaria le. A ordem e por carencia
      # (ultimo_pacote_em), nao por indice fixo: canal que falhou nao perde a
      # vez e canal reautorizado volta ao topo sozinho. O rodizio so acrescenta
      # o portao que faltava na fila: ter refresh_token. `pode_produzir` cobre
      # youtube_channel_id e o teto de 3 pacotes em 24h, mas nao a credencial —
      # sem ela o job renderiza 83 minutos de video e nao publica.
      - name: Escolher canal
        id: canal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CANAL="${{ inputs.canal }}"
          if [ -z "$CANAL" ] && [ -n "$SUPABASE_URL" ]; then
            # Pega os primeiros da fila e fica no primeiro que tem YAML no repo:
            # canal cadastrado no banco sem config/canais/<slug>.yaml faria o
            # Config.load levantar FileNotFoundError e derrubaria o job.
            FILA=$(curl -sf "$SUPABASE_URL/rest/v1/v_maquina_rodizio?select=slug&limit=13" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[].slug')
            for s in $FILA; do
              if [ -f "config/canais/$s.yaml" ]; then CANAL="$s"; break; fi
            done
          fi
          if [ -z "$CANAL" ]; then
            echo "::warning::rodizio indisponivel — caindo no default.yaml (Setiap Level)"
          else
            echo "Canal deste run: $CANAL"
          fi
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"

          # Formato: short por padrao, longo so em canal que ganhou o direito.
          #
          # Medido em 12/08/2026, idade comparavel e regra das 48h respeitada:
          # shorts fazem 23,0 views/dia e longos fazem 0,1. Dezenove longos
          # publicados somam SETE views; quatorze shorts somam 2.363. E o longo
          # custa 83 min de runner contra ~5 do short.
          #
          # Short constroi inscrito, inscrito torna o longo assistivel, longo
          # gera hora de exibicao para o YPP. A ordem importa e estava invertida.
          FORMATO="${{ inputs.formato }}"
          # No evento `schedule` inputs.formato vem vazio; no dispatch, "auto"
          # significa a mesma coisa — decida por mim.
          [ "$FORMATO" = "auto" ] && FORMATO=""
          if [ -z "$FORMATO" ] && [ -n "$CANAL" ] && [ -n "$SUPABASE_URL" ]; then
            LIBERADO=$(curl -sf "$SUPABASE_URL/rest/v1/v_maquina_longos_liberados?slug=eq.$CANAL&select=slug" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].slug // empty')
            if [ -n "$LIBERADO" ]; then
              FORMATO=longo
              echo "$CANAL ja tem short acima de 300 views — este run e longo."
            else
              FORMATO=shorts
              echo "$CANAL ainda nao provou o nicho — este run e short."
            fi
          fi
          echo "formato=${FORMATO:-shorts}" >> "$GITHUB_OUTPUT"

      - name: Puxar historico do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Sem isto o puxar enche data/maquina.db enquanto a producao le
          # data/<canal>/maquina.db — a compliance comeca o job sem historico
          # nenhum, e as tres barreiras anti-spam rodam cegas.
          MAQ_CANAL: ${{ steps.canal.outputs.canal }}
        run: maquina sincronizar

      - name: Diagnostico do ambiente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
        run: maquina doctor

      - name: Restaurar credencial do YouTube
        env:
          YT_TOKEN_SETIAP_LEVEL: ${{ secrets.YT_TOKEN_SETIAP_LEVEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # O canal vem do passo "Escolher canal" — no cron ele e o do
          # rodizio, no dispatch e o que o operador pediu. Ate 2026-08-12 este
          # passo so conhecia o YT_TOKEN_SETIAP_LEVEL e o job nunca definia
          # MAQ_CANAL: o cron produzia SEMPRE contra o default.yaml e gravava as
          # linhas sem canal. Resultado medido: 15 das 30 linhas do estoque com
          # canal nulo. Era um produtor monocanal disfarcado de motor da frota.
          mkdir -p secrets
          CANAL="${{ steps.canal.outputs.canal }}"
          if [ -n "$CANAL" ]; then
            TOKEN=$(curl -sf "$SUPABASE_URL/rest/v1/config?chave=eq.yt_token_$CANAL&select=valor" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -c '.[0].valor // empty')
            if [ -n "$TOKEN" ]; then
              printf '%s' "$TOKEN" > secrets/youtube_token.json
              printf '%s' "$TOKEN" > "secrets/youtube_token_$CANAL.json"
              echo "Credencial do canal $CANAL (Supabase)."
            else
              echo "::warning::sem token para $CANAL — produz sem publicar"
            fi
          elif [ -n "$YT_TOKEN_SETIAP_LEVEL" ]; then
            printf '%s' "$YT_TOKEN_SETIAP_LEVEL" > secrets/youtube_token.json
            echo "Sem canal informado — usando default.yaml (Setiap Level)."
          else
            echo "Sem credencial — producao sem publicacao."
          fi

      - name: Produzir e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_TEMPLATE_ID: ${{ secrets.CANVA_TEMPLATE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Sem isto o Config.load cai no default.yaml e o video sai no idioma e
          # no nicho do Setiap Level, seja qual for o canal pedido.
          MAQ_CANAL: ${{ steps.canal.outputs.canal }}
        run: |
          FORMATO="${{ steps.canal.outputs.formato }}"
          QUANTIDADE="${{ inputs.quantidade || '1' }}"
          # quantidade=0 ou vazio -> 1 por run (cron horario); titulo especifico -> 1 direto
          [ "$QUANTIDADE" = "0" ] && QUANTIDADE=1

          TEM_YT=false
          [ -s secrets/youtube_token.json ] && TEM_YT=true

          if [ -n "${{ inputs.titulo }}" ]; then
            if $TEM_YT; then
              maquina produzir "${{ inputs.titulo }}" --formato "$FORMATO" --publicar
            else
              maquina produzir "${{ inputs.titulo }}" --formato "$FORMATO"
            fi
          else
            OK=0
            FAIL=0
            for i in $(seq 1 "$QUANTIDADE"); do
              echo ""
              echo "=== Produzindo video $i de $QUANTIDADE (eixo rotativo) ==="
              if $TEM_YT; then
                CMD="maquina auto --formato $FORMATO --publicar"
              else
                CMD="maquina auto --formato $FORMATO"
              fi
              if $CMD; then
                OK=$((OK+1))
              else
                echo "Video $i falhou — continuando o lote..."
                FAIL=$((FAIL+1))
              fi
            done
            echo ""
            echo "=== Lote concluido: $OK produzidos, $FAIL falharam ==="
            [ "$OK" -eq 0 ] && exit 1 || exit 0
          fi

      - name: Limpar credencial
        if: always()
        run: rm -f secrets/youtube_token.json

      - name: Listar producao
        if: always()
        run: maquina listar

      # O cache do Actions expira; o Supabase e onde o historico sobrevive.
      # Sem os secrets o comando avisa e sai com 0 — nao quebra o job.
      - name: Sincronizar estado com o Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAQ_CANAL: ${{ steps.canal.outputs.canal }}
        run: maquina sincronizar

      # O video fica como artefato para revisao humana. A publicacao e um
      # workflow separado, disparado depois que voce assiste. Ver
      # docs/03-compliance-monetizacao.md.
      - name: Subir para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-para-revisao
          path: |
            out/**/final.mp4
            out/**/thumbnail.jpg
            out/**/legendas.srt
          retention-days: 14
          if-no-files-found: warn
