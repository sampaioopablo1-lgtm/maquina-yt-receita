name: Producao de video

# O motor da maquina. O runner ubuntu-latest ja traz ffmpeg instalado.
on:
  schedule:
    # Diario, 09:00 UTC (06:00 BRT). O teto de 3/dia da config e a cota da
    # YouTube API (~6 uploads/dia) sao os limites reais — nao o cron.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato do video"
        type: choice
        options: [longo, shorts]
        default: longo
      titulo:
        description: "Titulo especifico (vazio = a maquina escolhe a pauta)"
        type: string
        default: ""

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verificar ffmpeg do runner
        run: ffmpeg -version | head -1

      - name: Instalar
        run: pip install -e .

      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: data
          key: maquina-estado-${{ github.run_id }}
          restore-keys: maquina-estado-

      - name: Diagnostico do ambiente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
        run: maquina doctor

      - name: Produzir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
        run: |
          if [ -n "${{ inputs.titulo }}" ]; then
            maquina produzir "${{ inputs.titulo }}" --formato "${{ inputs.formato || 'longo' }}"
          else
            maquina auto --formato "${{ inputs.formato || 'longo' }}"
          fi

      - name: Listar producao
        if: always()
        run: maquina listar

      # O video fica como artefato para revisao humana. A publicacao e um
      # workflow separado, disparado depois que voce assiste. Ver
      # docs/03-compliance-monetizacao.md.
      - name: Subir para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-para-revisao
          path: |
            out/**/final.mp4
            out/**/thumbnail.jpg
            out/**/legendas.srt
          retention-days: 14
          if-no-files-found: warn
