name: Producao de video

# O motor da maquina. O runner ubuntu-latest ja traz ffmpeg instalado.
# Meta: 10 videos/dia por canal, um eixo tematico diferente por video.
# Cota YouTube API: ~6 uploads/dia — producao e publicacao sao passos separados.
on:
  schedule:
    # Diario, 09:00 UTC (06:00 BRT).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato do video"
        type: choice
        options: [longo, shorts]
        default: longo
      titulo:
        description: "Titulo especifico (vazio = a maquina escolhe a pauta)"
        type: string
        default: ""
      quantidade:
        description: "Quantos videos produzir neste lote (0 ou vazio = 10)"
        type: string
        default: "10"

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    # ~25 min/video x 10 videos = 250 min; 300 da folga para retomadas.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verificar ffmpeg do runner
        run: ffmpeg -version | head -1

      - name: Instalar
        run: pip install -e .

      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: data
          key: maquina-estado-${{ github.run_id }}
          restore-keys: maquina-estado-

      - name: Diagnostico do ambiente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
        run: maquina doctor

      - name: Produzir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAQ_TTS_VOICE_ID: ${{ secrets.MAQ_TTS_VOICE_ID }}
          MAQ_TTS_URL: ${{ secrets.MAQ_TTS_URL }}
          MAQ_TTS_TOKEN: ${{ secrets.MAQ_TTS_TOKEN }}
        run: |
          FORMATO="${{ inputs.formato || 'longo' }}"
          QUANTIDADE="${{ inputs.quantidade || '10' }}"
          # quantidade=0 ou vazio -> 10; titulo especifico -> 1 video direto
          [ "$QUANTIDADE" = "0" ] && QUANTIDADE=10

          if [ -n "${{ inputs.titulo }}" ]; then
            maquina produzir "${{ inputs.titulo }}" --formato "$FORMATO"
          else
            OK=0
            FAIL=0
            for i in $(seq 1 "$QUANTIDADE"); do
              echo ""
              echo "=== Produzindo video $i de $QUANTIDADE (eixo rotativo) ==="
              if maquina auto --formato "$FORMATO"; then
                OK=$((OK+1))
              else
                echo "Video $i falhou — continuando o lote..."
                FAIL=$((FAIL+1))
              fi
            done
            echo ""
            echo "=== Lote concluido: $OK produzidos, $FAIL falharam ==="
            [ "$OK" -eq 0 ] && exit 1 || exit 0
          fi

      - name: Listar producao
        if: always()
        run: maquina listar

      # O cache do Actions expira; o Supabase e onde o historico sobrevive.
      # Sem os secrets o comando avisa e sai com 0 — nao quebra o job.
      - name: Sincronizar estado com o Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: maquina sincronizar

      # O video fica como artefato para revisao humana. A publicacao e um
      # workflow separado, disparado depois que voce assiste. Ver
      # docs/03-compliance-monetizacao.md.
      - name: Subir para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-para-revisao
          path: |
            out/**/final.mp4
            out/**/thumbnail.jpg
            out/**/legendas.srt
          retention-days: 14
          if-no-files-found: warn
