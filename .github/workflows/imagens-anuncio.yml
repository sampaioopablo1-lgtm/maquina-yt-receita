name: Criativos dos anuncios — gerar do Pexels

# Existe porque a sessao do agente NAO alcanca o Pexels: o gateway de egresso
# nega CONNECT para pexels.com (403, medido em 11/09/2026). O runner alcanca, e
# a chave ja mora no Supabase que o broll.py le desde agosto — entao a geracao
# acontece aqui e as pecas voltam commitadas.
#
# So workflow_dispatch: roda quando a lista PECAS em
# fabrica/criativos_anuncio.py muda, nao em horario.

on:
  workflow_dispatch:
  # O dispatch pela API exige o arquivo no branch padrao, e este vive no branch
  # de trabalho — a chamada volta 404. O gatilho de push resolve: mexeu na
  # lista de pecas ou no gerador, as artes saem sozinhas.
  #
  # O filtro de caminho tambem evita laco: o commit do bot toca so
  # entregas/campanha/imagens, que nao esta na lista abaixo.
  push:
    branches: [claude/opc-pablo-reel-ryxld4]
    paths:
      - fabrica/criativos_anuncio.py
      - .github/workflows/imagens-anuncio.yml

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      # Sem isto a tipografia cai no DejaVu, que funciona mas nao tem o peso
      # de uma peca paga. O Montserrat e o que a categoria usa.
      - name: Baixar Montserrat
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/fontes
          base=https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf
          curl -sSLf -o /tmp/fontes/Montserrat-Bold.ttf "$base/Montserrat-Bold.ttf"
          curl -sSLf -o /tmp/fontes/Montserrat-Regular.ttf "$base/Montserrat-Regular.ttf"

      # Sem chave nao ha o que gerar, e isso NAO e falha de codigo: o job sai
      # verde com um aviso. Antes desta trava o workflow pintava o PR de
      # vermelho a cada push, por um motivo ja conhecido e documentado — e
      # vermelho cronico e como se perde a atencao no vermelho que importa.
      - name: Ver se ha chave do Pexels
        id: chave
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -uo pipefail
          motivo=$(python3 -c "
          import sys; sys.path.insert(0, 'fabrica')
          from broll import chave, ORIGEM_DA_CHAVE
          print('ok' if chave() else ORIGEM_DA_CHAVE)
          ")
          if [ "$motivo" = "ok" ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            {
              echo "## Pecas nao geradas: sem chave do Pexels"
              echo ""
              echo "\`$motivo\`"
              echo ""
              echo "Conserto: cadastrar \`PEXELS_API_KEY\` em Settings -> Secrets"
              echo "-> Actions. O gerador le essa variavel antes de tentar o banco."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gerar as 20 pecas
        if: steps.chave.outputs.tem == 'sim'
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python3 fabrica/criativos_anuncio.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commitar o que foi gerado
        if: steps.chave.outputs.tem == 'sim'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregas/campanha/imagens
          # Rodar de novo com as mesmas fotos nao gera commit vazio.
          if git diff --cached --quiet; then
            echo "nada novo para commitar"
            exit 0
          fi
          git commit -m "Criativos gerados do Pexels (run ${GITHUB_RUN_ID})"
          git push
