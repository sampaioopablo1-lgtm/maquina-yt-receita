name: WeSales - finalizar configuracao

# Por que existe: o conteiner onde esta configuracao e escrita nao alcanca o GHL
# (services. e backend.leadconnectorhq.com respondem 000 pelo proxy de egresso,
# medido em 27/09). O runner do GitHub alcanca, e tem o segredo GHL_PIT. Este e
# o unico arquivo que faz a finalizacao — de proposito separado de
# wesales-g03.yml, que tem cron de producao e nao deve carregar outra funcao.
#
# Sem cron: isto ESCREVE na estrutura e nos registros do CRM. Roda so por botao.
# O padrao e `recon`, que le e nao escreve, entao apertar sem pensar nao muda nada.
#
# NOTA DE ALCANCE, para quem vier depois: um workflow_dispatch pela API do GitHub
# so resolve o workflow se o arquivo existir no BRANCH PADRAO — testado, um
# arquivo que existe apenas no branch de trabalho devolve 404. Enquanto este
# arquivo nao estiver no branch padrao, ele so roda pelo botao da tela do
# GitHub, com "Use workflow from" apontando para o branch de trabalho.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "recon le e nao escreve. Os outros escrevem no CRM."
        type: choice
        default: recon
        options:
          - recon
          - pastas
          - donos
          - verificar
          - filas
          - filas-aplicar
          - formulario
          - transferir
          - transferir-aplicar
          - simular-reuniao
          - inventario
      user_id:
        description: "Para modo=donos e transferir*: id do usuario que recebe os leads"
        type: string
        required: false

permissions:
  contents: read

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Confere o mapa campo->pasta contra o snapshot versionado. Offline, sem
      # segredo, sempre. Falha se sobrar, faltar ou repetir campo — antes de
      # qualquer escrita.
      - name: Conferir o mapa de campos
        run: python wesales/tools/pastas_de_campo.py --plano

      - name: Reconhecimento (le a conta, escreve nada)
        if: ${{ inputs.modo == 'recon' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_STORAGE_STATE: ${{ secrets.GHL_STORAGE_STATE }}
        run: python wesales/tools/finalizar.py --recon

      # `pastas` foi reaproveitado: pasta nao sai por API (400), mas NOME e POSICAO
      # de campo saem. Este passo poe a ficha do contato em ordem BANT e cria
      # `SDR responsavel` como lista com os usuarios do CRM. Rode `formulario`
      # (a sonda) antes; ela prova num campo de teste o que a API aceita.
      - name: Ficha do contato em ordem BANT (APLICA)
        if: ${{ inputs.modo == 'pastas' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/campos_bant.py --aplicar

      - name: Dono do lead
        if: ${{ inputs.modo == 'donos' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: |
          if [ -n "${{ inputs.user_id }}" ]; then
            python wesales/tools/finalizar.py --donos --user "${{ inputs.user_id }}"
          else
            python wesales/tools/finalizar.py --donos
          fi

      - name: Filas do discador (DRY — calcula e imprime, escreve nada)
        if: ${{ inputs.modo == 'filas' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/atuador_filas.py

      - name: Filas do discador (APLICA)
        if: ${{ inputs.modo == 'filas-aplicar' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/atuador_filas.py --aplicar

      # O formulario nativo nao e editavel por API; a ficha do contato e o
      # formulario (decisao do dono em 27/09: tudo dentro do CRM). Este modo e a
      # SONDA: cria um campo de teste proprio, prova renomear/posicao/pasta/opcoes
      # e o apaga. Nao toca em campo real.
      - name: Sonda da estrutura de campos (campo de teste proprio)
        if: ${{ inputs.modo == 'formulario' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/campos_bant.py --sondar

      # Transferencia de carteira para o SDR. O DRY nao escreve: imprime o que
      # mudaria, separando etapa de SDR de etapa de closer.
      - name: Transferir carteira ao SDR (DRY — calcula e imprime, escreve nada)
        if: ${{ inputs.modo == 'transferir' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/finalizar.py --transferir --user "${{ inputs.user_id }}"

      - name: Transferir carteira ao SDR (APLICA)
        if: ${{ inputs.modo == 'transferir-aplicar' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/finalizar.py --transferir --aplicar --user "${{ inputs.user_id }}"

      - name: Verificacao (rele a conta e prova)
        if: ${{ inputs.modo == 'verificar' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/finalizar.py --verificar

      # Marca e cancela uma reuniao SO no contato de teste (fixo no script) e
      # imprime o que os workflows de reuniao fizeram. Nao exclui nada.
      - name: Simular reuniao no contato de teste
        if: ${{ inputs.modo == 'simular-reuniao' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/simular_reuniao.py

      # Inventario de modulos do GHL na subconta. Leitura pura.
      - name: Inventario de modulos (le, escreve nada)
        if: ${{ inputs.modo == 'inventario' }}
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/inventario_ghl.py
