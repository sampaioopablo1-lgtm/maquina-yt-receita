name: WeSales - relogio (filas + governador a cada 30 min)

# Por que existe (28/09): o agendador do GitHub neste repositorio roda os crons a cada 3-6 h
# (medido: faxina "*/10" rodou 00:27, 06:29, 15:08), e as filas/governador precisam de 30 min.
# Este relogio fica ligado: a cada 30 min, seg-sex 08:00-21:00 (Sao Paulo), roda o atuador das
# filas e o governador do WhatsApp (e o Calendly -> CRM a qualquer hora); depois de ~5h30 se relanca (workflow_dispatch pelo proprio
# GITHUB_TOKEN e permitido). O cron abaixo so reinicia a corrente se ela cair. Repositorio
# publico: minutos de Actions gratis.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: wesales-relogio
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ciclo de 30 min
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          CALENDLY_TOKEN: ${{ secrets.CALENDY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fim=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            dow=$(TZ=America/Sao_Paulo date +%u)
            hm=$(TZ=America/Sao_Paulo date +%H%M)
            # Calendly -> CRM a qualquer hora (lead marca reunião à noite e no fim de semana)
            [ -n "$CALENDLY_TOKEN" ] && { python wesales/tools/calendly_para_crm.py --aplicar || echo "calendly falhou nesta rodada"; }
            # Qualificação pré-preenchida com as respostas do anúncio (Prazo, Investe, Dor), a qualquer hora
            python wesales/tools/preencher_qualificacao.py --aplicar || echo "qualificação do anúncio falhou nesta rodada"
            if [ "$dow" -le 5 ] && [ $((10#$hm)) -ge 800 ] && [ $((10#$hm)) -le 2100 ]; then
              echo "==== $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') ===="
              git pull -q origin "${GITHUB_REF_NAME}" || true
              python wesales/tools/atuador_filas.py --aplicar || echo "atuador falhou nesta rodada"
              python wesales/tools/wa_governador.py --aplicar || echo "governador falhou nesta rodada"
              if [ "$dow" = "1" ] && [ $((10#$hm)) -ge 730 ]; then
                hoje=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
                ja=$(gh run list --workflow wesales-analises.yml --limit 10 --json createdAt,conclusion -q "[.[] | select(.conclusion==\"success\" and (.createdAt|startswith(\"$hoje\")))] | length" 2>/dev/null || echo 1)
                [ "$ja" = "0" ] && gh workflow run wesales-analises.yml --ref "${GITHUB_REF_NAME}" && echo "analise semanal disparada"
              fi
            else
              echo "fora do horario ($dow $hm)"
            fi
            # Depois do atuador (usa as tags desta rodada). Ordem da "Minha fila — SDR" (Prioridade), seg-sex 07:30-21:00: a lista chega ordenada
            if [ "$dow" -le 5 ] && [ $((10#$hm)) -ge 730 ] && [ $((10#$hm)) -le 2100 ]; then
              git pull -q origin "${GITHUB_REF_NAME}" || true
              python wesales/tools/ordem_fila.py --aplicar || echo "ordem da fila falhou nesta rodada"
            fi
            sleep 1800
          done
      - name: Relanca o relogio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wesales-relogio.yml --ref "${GITHUB_REF_NAME}"
