name: Frota — render paralelo por canal

# Por que este workflow existe — e a CORRECAO do numero que o justificava.
#
# Este cabecalho dizia: "o sandbox Composio renderiza a 208 s por cena, 260 min
# para um pacote de 75 cenas". Esse numero esta ERRADO por um fator de 25, e
# custou caro: durante toda a sessao de 13/08 eu descartei o sandbox como rota
# de render por causa dele, enquanto o Actions estava sem minutos e a maquina
# publicava zero.
#
# MEDIDO em 13/08/2026 no proprio sandbox (1 vCPU, 985 MB), no caso real de
# composicao em camadas — tres PNG de 1280x720, zoompan, loudnorm, aac:
#
#     cena em camadas (11 s de video)      8,4 s
#     cena simples sem camadas             1,2 s
#     projecao para 81 cenas              11 min
#
# Onze minutos, nao duzentos e sessenta. O sandbox da conta de um pacote
# inteiro. A frota continua valendo pelo PARALELISMO — dez canais ao mesmo
# tempo, cada um no seu job — e nao porque o sandbox seja inviavel.
#
# Licao: numero em comentario envelhece igual a numero em codigo, e ninguem
# reconfere porque ele parece medido. Este agora traz a data e o metodo.
#
# A PAUTA e o ROTEIRO continuam fora daqui, na rotina horaria: e de la que vem a
# qualidade. Este workflow recebe a spec pronta e faz a parte mecanica —
# renderizar, entregar, publicar e fechar os passos de Studio.

on:
  workflow_dispatch:
    inputs:
      pacotes:
        description: 'JSON: [{"canal":"kolejny-poziom","pacote":"kolejny-poziom-008","idioma":"pl"}]'
        type: string
        required: true
      publicar:
        description: "Publicar no YouTube ao fim do render"
        type: boolean
        default: true

concurrency:
  group: frota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.ler.outputs.matriz }}
    steps:
      - id: ler
        # jq sem espaco depois dos dois-pontos: `{include: .}` num escalar YAML
        # sem aspas e erro de sintaxe do proprio arquivo, nao do jq.
        run: |
          echo "matriz=$(echo '${{ inputs.pacotes }}' | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"

  produzir:
    needs: preparar
    runs-on: ubuntu-latest
    # 120 min era o teto do render; virou o tempo que um job PENDURADO segura
    # a frota inteira. Medido em 17/08/2026: tres vezes no mesmo dia um job
    # ficou preso por 45 a 100 minutos. Como o `concurrency` deixa so 1 run
    # rodando e 1 pendente, os disparos seguintes se cancelavam um ao outro e
    # NADA era produzido.
    #
    # O 25 que ficou aqui veio de "nenhum render legitimo passa de 15 min",
    # que eu ESCREVI SEM CONFERIR. O historico do proprio repositorio ja
    # desmentia: dos runs que produziram alguma coisa em 17/08, os bem
    # sucedidos levaram 10,7, 16,4 e 26,6 min. O teto de 25 matava o de 26,6.
    #
    # E o custo subiu depois disso. O conserto do tremor (SUAVIZA=2, ampliar
    # antes do zoompan) levou o clipe de 9,3 s para 11,7 s — mais 26%. Um
    # pacote de 65 cenas passa de 12 min so nos clipes do longo, e ainda tem
    # TTS por cena, short, concat, apt-get e pip. Em 18/08/2026 o teto de 25
    # matou o sx-educacao-002 aos 25 min exatos, duas vezes.
    #
    # 40 fica acima do render legitimo mais caro (26,6 + 26% = 33,5) e abaixo
    # do menor travamento observado (45). O numero e medido dos dois lados.
    timeout-minutes: 40
    strategy:
      fail-fast: false          # um canal que quebra nao derruba os outros
      max-parallel: 10
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # O runner ubuntu-latest NAO traz ffmpeg — medido em 2026-08-11, exit 127
      # "command not found". Sem este passo a fabrica morre na primeira cena.
      #
      # Devanagari tambem nao vem, e a falta dela NAO da erro: o cairosvg cai num
      # fallback e a legenda queimada sai VAZIA, defeito que so aparece assistindo
      # ao video pronto.
      # 24 segundos e o tempo tipico deste passo, medido em toda rodada. Em
      # 19/08/2026 ele pendurou DUAS vezes em duas horas — 21,5 min e 9,5 min
      # sem sair do lugar, com o espelho do apt sem responder. Sem teto, um
      # apt pendurado come o orcamento de 120 min do job inteiro e o pacote
      # perde a rodada em silencio; com teto, falha em cinco minutos, aparece
      # em vermelho e o redisparo (que passou nas duas vezes) e imediato.
      #
      # O retry precisa de teto POR CHAMADA, nao so por passo. Na primeira
      # versao deste conserto o loop era inutil: o `apt-get update` pendurou
      # sem imprimir uma linha sequer e comeu os cinco minutos inteiros, entao
      # a segunda tentativa nunca aconteceu. Medido no run 32229424929 —
      # nenhuma saida entre 07:47:13 e o timeout as 07:52:26.
      #
      # Com `timeout` em cada chamada, um espelho pendurado custa segundos
      # contados e a tentativa seguinte comeca de verdade. O que estava
      # ERRADO aqui era a frase seguinte: "tres tentativas cabem folgadas no
      # teto do passo". Nao cabiam — 3 x 250 s = 750 s contra um teto de
      # 360 s. Eu somei o orcamento de cabeca e nao conferi contra o teto que
      # eu mesmo tinha escrito duas horas antes. A conta agora esta escrita
      # dentro do passo, em numeros, para ser conferivel sem confiar em mim.
      - name: Instalar ffmpeg e fontes
        timeout-minutes: 10
        run: |
          set -uo pipefail

          # ORCAMENTO. O teto do PASSO precisa ser maior que a soma dos tetos
          # internos, senao a rota alternativa nunca chega a rodar. Foi o que
          # aconteceu no run 32237753936 em 19/08/2026: tres tentativas de apt
          # a ~250 s cada dentro de um teto de 6 min mataram o passo NO MEIO da
          # terceira, e o download estatico — escrito justamente para o apt
          # fora — nunca foi tentado. Rota de fuga que nao cabe no orcamento
          # nao e rota de fuga.
          #
          #     apt, 1a tentativa        60 + 120 = 180 s
          #     ffmpeg estatico                    120 s
          #     apt, 2a tentativa        60 + 120 = 180 s
          #                                       -------
          #                                        480 s  <  600 s do teto
          #
          # E a ORDEM tambem mudou. O estatico vem DEPOIS de uma unica
          # tentativa de apt, nao de tres: quando o espelho esta fora, cada
          # tentativa extra custa 3 min para chegar no mesmo lugar. A segunda
          # tentativa de apt sobrou para o fim porque, se o estatico ja deu
          # ffmpeg, o que ainda falta sao as FONTES — e ai falhar nao e fatal.
          apt_tenta() {
            timeout 60 sudo apt-get update -qq \
              && timeout 120 sudo apt-get install -y -qq \
                   ffmpeg fonts-noto-core fonts-noto-cjk
          }

          via=""
          if apt_tenta; then
            via=apt
          else
            echo "::warning::apt nao respondeu na 1a tentativa — indo pelo binario estatico"
            URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            if curl -sSL --fail --max-time 120 "$URL" -o /tmp/ff.tar.xz \
               && mkdir -p /tmp/ffbin \
               && tar -xJf /tmp/ff.tar.xz -C /tmp/ffbin --strip-components=2 \
               && sudo install -m 755 /tmp/ffbin/ffmpeg /usr/local/bin/ffmpeg \
               && sudo install -m 755 /tmp/ffbin/ffprobe /usr/local/bin/ffprobe; then
              via=estatico
            fi
            # Segunda tentativa de apt: com o estatico no lugar ela existe so
            # pelas fontes; sem ele, e a ultima chance de ter ffmpeg.
            if apt_tenta; then
              via="${via:-apt}+apt"
            elif [ -z "$via" ]; then
              echo "::error::sem ffmpeg: apt fora nas duas tentativas e o download estatico falhou"
              exit 1
            else
              # As FONTES nao tem rota alternativa, e isso e deliberado: o passo
              # "Conferir glifos" ja rasteriza cada caractere de tela e reprova
              # o pacote com "sairiam como tofu" quando falta glifo. Sem apt um
              # pacote latino segue e um em devanagari ou grego para no portao,
              # em vez de sair com legenda vazia.
              echo "::warning::sem apt: fontes ficaram com o que a imagem do runner ja tinha — o portao de glifos decide"
            fi
          fi
          echo "ffmpeg via: ${via}"
          ffmpeg -version | head -1
          fc-list | wc -l | sed "s/^/fontes instaladas: /"

      - name: Instalar fabrica
        run: pip install -q edge-tts cairosvg pydantic pillow

      - name: Baixar spec e trilhas
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trilhas

          # O REPOSITORIO e a versao de registro da spec, nao o Storage. As 22
          # specs vivem em fabrica/specs/ e sao versionadas; a copia no Storage
          # e que envelhece calada — e a rotina ja avisa disso ("a copia em
          # /tmp/fab ficou desatualizada e produziu o pacote errado sem levantar
          # erro"). O Storage fica como plano B, para spec gerada fora do git.
          if [ -f "fabrica/specs/${{ matrix.pacote }}.json" ]; then
            cp "fabrica/specs/${{ matrix.pacote }}.json" spec.json
            echo "spec: repositorio (fabrica/specs/${{ matrix.pacote }}.json)"
          else
            curl -sS --fail -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              "$SB/storage/v1/object/videos-maquina/specs/${{ matrix.pacote }}.json" -o spec.json
            echo "spec: Storage (nao existe no repo)"
          fi

          # A trilha e assinatura sonora do canal; sem ela a fabrica renderiza
          # mudo. Este passo baixava `trilhas.tgz`, que NAO EXISTE no bucket —
          # as faixas estao soltas em trilhas/*.mp3. Com `|| true` e o `[ -s ]`
          # a falha virava a linha "sem trilhas" e o render seguia sem musica,
          # sem nenhum passo reclamar.
          #
          # O Cipher2 saiu da lista em 14/08/2026: baixado direto do bucket,
          # HTTP 404 NoSuchKey, e nenhum dos treze canais esta registrado nele.
          # Um fantasma na lista fazia o hash dividir por quatro quando so tres
          # chegam — e o hash so importa como ultimo recurso, porque desde
          # 14/08 toda spec declara `trilha` e ela vence.
          # DUAS FONTES PARA A TRILHA, e a segunda existe por causa de
          # 25/08/2026: o bucket entrou em restricao de Fair Use e passou a
          # devolver 402 em tudo. O render nao depende do Supabase para nada
          # mais — so a trilha dependia, e ela parava a producao inteira.
          #
          # A segunda fonte e a ORIGINAL: as tres faixas sao CC-BY do Kevin
          # MacLeod e ficam publicas no incompetech.com. Baixar de la nao e
          # contorno, e ir na origem — e mantem o credito do copy.md exato,
          # porque e literalmente o mesmo arquivo.
          baixa() {
            local faixa="$1" alvo="/tmp/trilhas/$1.mp3"
            curl -sS --max-time 120 -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              "$SB/storage/v1/object/videos-maquina/trilhas/$faixa.mp3" \
              -o "$alvo" || true
            # O TESTE E DECODIFICAR, nao olhar os primeiros bytes.
            #
            # A primeira versao disto conferia se o arquivo comecava com o
            # inicio do JSON de erro do Supabase. Nao pegou: o run 32822376769
            # baixou tres arquivos, imprimiu "trilhas: 3 faixas", renderizou
            # 88 clipes por onze minutos e so entao a etapa 6 descobriu que
            # nenhuma tocava. Adivinhar o formato do erro alheio e sempre
            # frageil; perguntar ao ffprobe se aquilo e audio nao e.
            ffprobe -v error -show_entries format=duration -of csv=p=0 \
              "$alvo" 2>/dev/null | grep -qE '^[0-9]+' && return 0
            rm -f "$alvo"
            # O nome no incompetech usa espaco onde o nosso usa sublinhado.
            local nome="${faixa//_/%20}"
            curl -sSL --max-time 120 \
              "https://incompetech.com/music/royalty-free/mp3-royaltyfree/$nome.mp3" \
              -o "$alvo" || true
            [ -s "$alvo" ] || { rm -f "$alvo"; return 1; }
            echo "trilha $faixa: veio do incompetech (Storage fora do ar)"
          }
          for faixa in Wholesome Inspired Deliberate_Thought; do
            baixa "$faixa" || echo "::warning::trilha $faixa nao veio de nenhuma das duas fontes"
          done
          N=$(ls /tmp/trilhas/*.mp3 2>/dev/null | wc -l)
          echo "trilhas: $N faixas"
          [ "$N" -gt 0 ] || { echo "::error::nenhuma trilha baixada — o render sairia mudo"; exit 1; }

          python3 -c "import json;s=json.load(open('spec.json'));print('cenas:',len(s['longo']),'| short:',len(s.get('short',[])))"

      # Enquadramento ANTES do render. O visual.py ja media tinta na borda, mas
      # so no video pronto e amostrando 12 quadros: o nivel-do-jogo-002 reprovou
      # em t=250,1s DEPOIS de renderizar 51 clipes e a trilha (run 31659140900),
      # e amostrar 12 quadros de 51 cenas ve uma cena em quatro — o defeito
      # ainda podia passar. Aqui cada cena e rasterizada sozinha, todas entram,
      # e custa segundos.
      - name: Conferir enquadramento
        run: python3 fabrica/layout.py spec.json

      # Glifos DEPOIS do apt-get e AQUI, nao na maquina de quem escreveu a
      # spec. O container da sessao tem cobertura Noto muito mais larga que
      # este runner (fonts-noto-core + cjk): medido em 13/08/2026, la nao
      # existe um so codepoint alfabetico com zero fontes, entao o mesmo
      # comando roda verde la e aprovaria o que aqui vira tofu.
      #
      # E tofu nao e um erro visivel: e o retangulo branco. Ele TEM tinta,
      # entao passa no layout.py e no visual.py, e so aparece assistindo ao
      # video pronto. Custa segundos conferir; custa um pacote nao conferir.
      # Idioma ANTES do render, e barato: le texto e nao abre nem uma fonte.
      # Nenhum outro passo pega isto — o layout mede pixel, o glifo pergunta se
      # existe desenho para o caractere, e portugues e indonesio usam o mesmo
      # alfabeto. Um roteiro meio virado passa em tudo e produz um video que o
      # TTS le com os fonemas errados. Nao tem conserto parcial: reescreve.
      - name: Conferir idioma
        run: python3 fabrica/idioma.py spec.json

      - name: Conferir glifos
        run: python3 fabrica/prontidao.py spec.json

      # Trinta segundos aqui valem vinte minutos la na frente: em 19/08/2026
      # nove dos doze tokens morreram em cascata e o agla-level-004
      # renderizou inteiro antes de descobrir que nao tinha onde publicar.
      - name: Conferir token do canal
        if: ${{ inputs.publicar }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 fabrica/confere_token.py "${{ matrix.canal }}"

      # A spec que declara footage e nao acha a chave produz um pacote que
      # NAO e o que ela descreve — o agla-level-004 saiu com 7 cenas de
      # desenho onde a spec pedia 7 de footage, e a causa era uma linha que
      # nunca foi gravada no banco (aprendizado 309). Falhar aqui custa dois
      # segundos; descobrir no frame custa o render inteiro.
      - name: Conferir chave do broll
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 fabrica/confere_broll.py spec.json

      # Mesma logica do portao acima, aplicada ao NOME do pacote. A trava
      # contra republicacao sempre existiu dentro do publicar.py, mas so roda
      # depois do render — e em 19/08/2026 ela reprovou o kolejny-poziom-007
      # depois de 89 cenas e 17 min de runner, porque o nome ja pertencia a um
      # video de 11/08. A pergunta e a mesma; o que muda e a hora.
      - name: Conferir nome do pacote
        if: ${{ inputs.publicar }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 fabrica/publicar.py spec.json \
            --canal "${{ matrix.canal }}" --so-conferir-nome

      - name: Renderizar
        id: render
        # SB/KEY entram para o broll.py buscar config.pexels_api_key — a chave
        # do Pexels mora no banco, nao no git nem nos secrets. Sem eles a
        # etapa 1.5 so cai no fallback; o render nunca depende de broll.
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 fabrica/etapas.py spec.json

      # A ENTREGA NO STORAGE NAO PODE DERRUBAR A PUBLICACAO.
      #
      # Ate 24/08/2026 este passo usava `set -e` + `curl --fail`, entao qualquer
      # erro matava o job — e o passo seguinte, que publica no YouTube, era
      # PULADO. Naquele dia o bucket estourou a cota do plano e passou a
      # devolver HTTP 402: o video renderizava, gastava treze minutos de runner,
      # e nao ia ao ar. O pior desfecho possivel, porque nada se aproveitava.
      #
      # Subir no YouTube nao depende do Storage: o `publicar.py` le os arquivos
      # do disco do runner, que ja estao prontos aqui. O Storage e ponte para o
      # Drive, e ponte quebrada nao justifica jogar fora a carga.
      #
      # Entao o passo passa a tolerar falha e a GRITAR, em vez de matar. O 402
      # ganha mensagem propria porque a acao dele e outra: nao adianta
      # retentar, alguem precisa liberar espaco ou subir o plano.
      - name: Entregar no Storage
        id: storage
        continue-on-error: true
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          D="/tmp/f/${{ matrix.pacote }}"
          HOJE=$(date -u +%F)
          FALHAS=0
          COTA=0
          for par in video.mp4:video/mp4 short.mp4:video/mp4 thumbnail.png:image/png legendas.srt:text/plain; do
            arq="${par%%:*}"; mime="${par##*:}"
            [ -f "$D/$arq" ] || continue
            CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              "$SB/storage/v1/object/videos-maquina/$HOJE-${{ matrix.pacote }}-$arq" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              -H "Content-Type: $mime" --data-binary @"$D/$arq" --max-time 300)
            if [ "$CODIGO" -ge 200 ] && [ "$CODIGO" -lt 300 ]; then
              echo "entregue: $arq"
            else
              echo "::warning::falha ao entregar $arq no Storage — HTTP $CODIGO"
              FALHAS=$((FALHAS+1))
              [ "$CODIGO" = "402" ] && COTA=1
            fi
          done
          if [ "$COTA" = "1" ]; then
            echo "::error::Storage devolveu HTTP 402 (Payment Required): a COTA do bucket videos-maquina acabou. Retentar nao resolve — e preciso liberar espaco ou subir o plano. A publicacao segue mesmo assim, e o registro grava supabase_url NULO para o que nao subiu."
          elif [ "$FALHAS" -gt 0 ]; then
            echo "::error::$FALHAS arquivo(s) nao subiram no Storage. A publicacao segue; o Drive e que fica sem fonte."
          fi
          echo "falhas=$FALHAS" >> "$GITHUB_OUTPUT"

      # `always()` de proposito, MAS amarrado ao RENDER e nao ao Storage.
      #
      # A primeira versao desta condicao era so `always() && inputs.publicar`, e
      # ela estava errada — eu mesmo a escrevi e o run 32788965239 mostrou por
      # que em minutos. Naquele run o portao de token falhou, o render foi
      # PULADO, e mesmo assim o publicar.py rodou: sem arquivo nenhum em disco,
      # ele so produziu um traceback confuso que escondia a causa real.
      #
      # O que eu queria era "publicar mesmo se o Storage falhar". O que escrevi
      # foi "publicar aconteca o que acontecer". A condicao certa depende do
      # render ter tido sucesso: sem clipe nao ha o que publicar, e um erro
      # tardio e mais caro de ler do que um passo pulado.
      - name: Publicar no YouTube
        if: ${{ always() && inputs.publicar && steps.render.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # --idioma pode vir vazio: o publicar.py resolve por
        # config/canais/<slug>.yaml, que e onde os treze canais declaram idioma
        # desde sempre. A matriz continua vencendo quando preenchida, mas nao e
        # mais a UNICA fonte — repetir o idioma a mao em cada disparo e como um
        # video em hindi subia marcado como ingles.
        run: |
          python3 fabrica/publicar.py spec.json \
            --canal "${{ matrix.canal }}" \
            --idioma "${{ matrix.idioma }}"

      # O video fica disponivel mesmo se a publicacao falhar — o render custa
      # caro e nao se refaz por causa de um 4xx da API.
      - name: Artefato para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.pacote }}
          path: |
            /tmp/f/${{ matrix.pacote }}/video.mp4
            /tmp/f/${{ matrix.pacote }}/short.mp4
            /tmp/f/${{ matrix.pacote }}/thumbnail.png
            /tmp/f/${{ matrix.pacote }}/legendas.srt
            /tmp/f/${{ matrix.pacote }}/copy.md
          retention-days: 14
          if-no-files-found: warn
