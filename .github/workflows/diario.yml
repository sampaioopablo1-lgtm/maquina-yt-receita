name: Ciclo — informe e disparo da frota

# O informe e o disparo moram JUNTOS de proposito. Separados, o relatorio conta
# uma coisa e a frota faz outra: foi assim que eu reportei "quinze pacotes
# prontos" enquanto dez ja estavam no ar. Aqui os dois leem o mesmo `orquestra.py`
# contra o mesmo banco, no mesmo minuto.
#
# O que este workflow NAO faz: escolher pauta e escrever roteiro. Isso continua
# na rotina horaria, que e de onde vem a qualidade. Aqui e a parte mecanica —
# olhar o estado, escolher o que ja esta pronto, e mandar renderizar.

on:
  schedule:
    # A CADA 15 MINUTOS, nao uma vez ao dia. O ciclo curto so faz sentido
    # porque o orquestrador ja e idempotente: ele descarta pacote com
    # youtube_id, respeita o teto de tres por dia por canal, e o publicar.py
    # recusa republicacao consultando o banco. Sem essas tres travas, disparar
    # de quinze em quinze minutos seria uma maquina de duplicata.
    #
    # Quando nao ha nada pronto o job termina em segundos com um `notice` — o
    # custo de um ciclo vazio e desprezivel, e o ganho e que um pacote que
    # ficou pronto as 09:05 nao espera ate o dia seguinte.
    #
    # ATENCAO ao custo: em repositorio PRIVADO isto consome os 2.000 min/mes.
    # Em repositorio publico o Actions nao tem cota, e ai o ciclo de quinze
    # minutos e gratuito. Hoje o repo e privado e sem minutos: o cron nao
    # roda, e o unico efeito e que ele ja esta armado para quando destravar.
    # A cada 15 min o disparo chegava antes de o anterior terminar: o
    # `concurrency` do frota.yml deixa 1 rodando e 1 pendente, e o terceiro
    # CANCELA o pendente. Com o teto de 25 min por job, 30 min garante que a
    # vaga esteja livre quando o proximo chegar.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      disparar:
        description: "Disparar a frota, alem de informar"
        type: boolean
        default: true
      n:
        description: "Maximo de pacotes no disparo"
        type: string
        default: "10"

permissions:
  contents: read
  actions: write        # para disparar o frota.yml

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A fabrica inteira nao entra: o orquestra.py so precisa dos portoes
      # baratos, e o layout (que pede cairosvg e pillow) roda dentro do
      # frota.yml, por pacote, onde reprovar custa segundos.
      - name: Instalar
        run: pip install -q pyyaml

      - name: Montar o informe
        id: informe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 fabrica/orquestra.py relatorio | tee informe.txt
          {
            echo '```'
            cat informe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          MATRIZ=$(python3 fabrica/orquestra.py proximo --n "${{ inputs.n || '10' }}")
          echo "matriz=$MATRIZ" >> "$GITHUB_OUTPUT"
          echo "quantos=$(echo "$MATRIZ" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"

      # Um video no canal errado nao aparece como falha em lugar nenhum —
      # aparece como pauta que nao pegou. Medido em 14/08/2026: o pacote
      # resep-naik-level-002 inteiro foi para o canal do setiap-level e marcou
      # 0,0 views/dia, e a leitura obvia teria sido reescrever o roteiro.
      #
      # `continue-on-error` de proposito: isto e informe, nao portao. Bloquear
      # o disparo da frota por causa de um video ja publicado no lugar errado
      # nao conserta o video e para a producao dos outros doze canais.
      - name: Auditar canal de destino
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 fabrica/auditoria_canal.py | tee -a "$GITHUB_STEP_SUMMARY"

      # O informe vai para o banco, nao so para a aba de Actions: a rotina
      # horaria le config e repassa ao Pablo. Aba de Actions ninguem abre.
      - name: Guardar o informe no banco
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > corpo.json
          import json, os
          print(json.dumps({
              "chave": "relatorio_diario",
              "valor": {"texto": open("informe.txt", encoding="utf-8").read(),
                        "run": os.environ.get("GITHUB_RUN_ID", "")},
          }))
          PY
          curl -sS --fail -X POST "$SB/rest/v1/config" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data-binary @corpo.json >/dev/null
          echo "informe gravado em config.relatorio_diario"

      # A matriz viaja por ENV, nunca interpolada na linha de comando: ela e
      # JSON com aspas duplas, e `${{ }}` dentro de um `run:` cola o conteudo
      # cru no shell. Um pacote com aspas quebraria o comando — ou pior, seria
      # executado.
      - name: Disparar a frota
        if: ${{ (inputs.disparar == null || inputs.disparar) && steps.informe.outputs.quantos != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIZ: ${{ steps.informe.outputs.matriz }}
          QUANTOS: ${{ steps.informe.outputs.quantos }}
        run: |
          set -euo pipefail

          # NAO despachar com frota ja em andamento. Medido em 18/08/2026, run
          # 32093415020: o ciclo das 02:52 despachou enquanto a frota das 02:44
          # ainda renderizava o MESMO pacote — a matriz e calculada antes de o
          # pacote em voo publicar, entao ele parece pendente. O segundo run
          # renderizou 30 minutos e morreu na trava de titulo do publicar.py.
          # A trava segura a duplicata; quem devolve os 30 minutos e este
          # guarda. O pacote nao se perde: o proximo ciclo o pega.
          EM_VOO=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/frota.yml/runs?per_page=10" \
            | python3 -c 'import json,sys; print(sum(1 for r in json.load(sys.stdin)["workflow_runs"] if r["status"] in ("queued","in_progress")))')
          if [ "$EM_VOO" != "0" ]; then
            echo "::notice::Frota com $EM_VOO run em voo — disparo adiado para o proximo ciclo."
            exit 0
          fi

          echo "disparando $QUANTOS pacotes"
          python3 - <<'PY' > disparo.json
          import json, os
          # `pacotes` do frota.yml e string: quem faz o jq e ele.
          print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"],
                            "inputs": {"pacotes": os.environ["MATRIZ"],
                                       "publicar": True}}))
          PY
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/frota.yml/dispatches" \
            --data-binary @disparo.json

      - name: Nada a disparar
        if: ${{ steps.informe.outputs.quantos == '0' }}
        run: |
          echo "::notice::Nenhum pacote pronto. O informe acima diz o motivo de cada descarte."
