name: WeSales G03 - Promover leads

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-g03:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run G-03 promotion
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: python wesales/tools/promote_g03_scheduled.py
