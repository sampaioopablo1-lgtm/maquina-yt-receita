name: Publicar no YouTube

# Disparo manual e intencional: a revisao humana e a barreira que separa este
# projeto de uma fabrica de spam. Ver docs/03-compliance-monetizacao.md.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug do video (veja em `maquina listar`)"
        type: string
        required: true
      em_horas:
        description: "Agendar para daqui a N horas (0 = publicar agora)"
        type: string
        default: "3"
      privacidade:
        type: choice
        options: [public, unlisted, private]
        default: public

concurrency:
  group: publicacao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: youtube   # exige aprovacao se voce configurar reviewers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e .

      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: data
          key: maquina-estado-${{ github.run_id }}
          restore-keys: maquina-estado-

      - name: Baixar video revisado
        uses: actions/download-artifact@v4
        with:
          name: video-para-revisao
          path: out
        continue-on-error: true

      - name: Restaurar credencial do YouTube
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YT_TOKEN_JSON" > secrets/youtube_token.json
          test -s secrets/youtube_token.json || { echo "secret YT_TOKEN_JSON vazio"; exit 1; }

      - name: Publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          maquina publicar "${{ inputs.slug }}" \
            --em-horas "${{ inputs.em_horas }}" \
            --privacidade "${{ inputs.privacidade }}" \
            --yes

      - name: Limpar credencial
        if: always()
        run: rm -f secrets/youtube_token.json
