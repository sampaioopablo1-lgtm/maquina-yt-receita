name: Cold mail - relogio (le respostas e envia a cada 30 min)

# Mesmo desenho do wesales-relogio: o cron do GitHub neste repo atrasa horas, entao o job fica ligado
# ~5h30 rodando um ciclo a cada 30 min e depois se relanca. O cron abaixo so reinicia a corrente se cair.
#   ler     a qualquer hora: resposta de lead nao espera o horario comercial
#   enviar  so seg-sex dentro de COLDMAIL_JANELA (padrao 8-18, Sao Paulo); a janela e conferida no script
# Sem o segredo COLDMAIL_CONTAS o job sai na hora e nao se relanca (maquina desligada).
# Disparo manual com outro "comando" roda uma vez so (status, teste de login, simulacao).
#
# Dados: repositorio PRIVADO sampaioopablo1-lgtm/opc-crm-dados, pasta coldmail/ (mesma chave do monitor,
# DADOS_DEPLOY_KEY). Este repositorio e publico: lead nenhum entra aqui.
#   leads.csv     voce sobe/atualiza pelo site do GitHub; a cada ciclo os e-mails novos entram na fila
#   coldmail.db   estado da maquina (SQLite), gravado de volta a cada ciclo
#   STATUS.md     resumo atualizado a cada ciclo
on:
  workflow_dispatch:
    inputs:
      comando:
        description: "O que rodar"
        type: choice
        default: relogio
        options: [relogio, status, testar-contas, simular-envio, simular-leitura]
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: coldmail-relogio-${{ inputs.comando || 'relogio' }}
  cancel-in-progress: false

jobs:
  coldmail:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      COLDMAIL_CONTAS: ${{ secrets.COLDMAIL_CONTAS }}
      COLDMAIL_SEQUENCIA: ${{ secrets.COLDMAIL_SEQUENCIA }}
      COLDMAIL_DB: ${{ github.workspace }}/dados/coldmail/coldmail.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GHL_PIT: ${{ secrets.GHL_PIT }}
      COLDMAIL_MODO: ${{ vars.COLDMAIL_MODO }}
      COLDMAIL_POR_RODADA: ${{ vars.COLDMAIL_POR_RODADA }}
      COLDMAIL_JANELA: ${{ vars.COLDMAIL_JANELA }}
      COLDMAIL_EMPRESA: ${{ vars.COLDMAIL_EMPRESA }}
      COLDMAIL_OFERTA: ${{ vars.COLDMAIL_OFERTA }}
    steps:
      - name: Maquina ligada?
        id: ligada
        run: |
          if [ -z "$COLDMAIL_CONTAS" ]; then
            echo "sem o segredo COLDMAIL_CONTAS: maquina de cold mail desligada"
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            echo "sim=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ligada.outputs.sim == 'true'
      - uses: actions/setup-python@v5
        if: steps.ligada.outputs.sim == 'true'
        with:
          python-version: "3.12"
      - if: steps.ligada.outputs.sim == 'true'
        run: pip install -q anthropic
      - name: Clona o repositorio privado de dados
        if: steps.ligada.outputs.sim == 'true'
        env:
          DADOS_DEPLOY_KEY: ${{ secrets.DADOS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DADOS_DEPLOY_KEY" > ~/.ssh/dados && chmod 600 ~/.ssh/dados
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/dados -o IdentitiesOnly=yes"
          git clone -q git@github.com:sampaioopablo1-lgtm/opc-crm-dados.git dados
          mkdir -p dados/coldmail
          cd dados && git config user.name "coldmail" && git config user.email "coldmail@users.noreply.github.com"
      - name: Comando avulso
        if: steps.ligada.outputs.sim == 'true' && inputs.comando && inputs.comando != 'relogio'
        run: |
          # importa no clone local para a simulacao enxergar os leads; nada e gravado de volta no repositorio
          if [ -f dados/coldmail/leads.csv ]; then python coldmail/tools/cold.py importar dados/coldmail/leads.csv --aplicar; fi
          case "${{ inputs.comando }}" in
            status)          python coldmail/tools/cold.py status ;;
            testar-contas)   python coldmail/tools/cold.py contas --testar ;;
            simular-envio)   python coldmail/tools/cold.py enviar --forcar ;;
            simular-leitura) python coldmail/tools/cold.py ler ;;
          esac
      - name: Ciclo de 30 min
        if: steps.ligada.outputs.sim == 'true' && (!inputs.comando || inputs.comando == 'relogio')
        run: |
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/dados -o IdentitiesOnly=yes"
          grava() {
            python coldmail/tools/cold.py status > dados/coldmail/STATUS.md 2>&1 || true
            ( cd dados && git add -A coldmail && { git diff --cached --quiet || {
                git commit -q -m "coldmail $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
                for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done; }; } ) \
              || echo "nao consegui gravar no repositorio de dados nesta rodada"
          }
          fim=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            inicio=$(date +%s)
            echo "==== $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') ===="
            ( cd dados && git pull -q --rebase origin main ) || echo "pull do repositorio de dados falhou"
            if [ -f dados/coldmail/leads.csv ]; then
              python coldmail/tools/cold.py importar dados/coldmail/leads.csv --aplicar || echo "importacao falhou"
            fi
            python coldmail/tools/cold.py ler --aplicar || echo "leitura falhou nesta rodada"
            grava
            python coldmail/tools/cold.py enviar --aplicar || echo "envio falhou nesta rodada"
            grava
            resta=$(( 1800 - ($(date +%s) - inicio) ))
            if [ "$resta" -gt 0 ]; then sleep "$resta"; fi
          done
      - name: Relanca o relogio
        if: always() && steps.ligada.outputs.sim == 'true' && (!inputs.comando || inputs.comando == 'relogio')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run coldmail-relogio.yml --ref "${GITHUB_REF_NAME}"
