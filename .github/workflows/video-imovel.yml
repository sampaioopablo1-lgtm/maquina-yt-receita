name: Video de imovel

# Monta o vídeo de apresentação de um imóvel a partir das fotos REAIS dele
# (scripts/video_imovel.sh) e publica no bucket videos-imoveis. Reaproveita o
# mesmo runner com ffmpeg que já produz os vídeos do YouTube.
#
# Não é tour 360 e não alimenta o campo de tour — é o campo de vídeo do
# anúncio, hoje ocupado pelo vídeo institucional genérico em 2.867 dos 2.963
# anúncios publicados.

on:
  workflow_dispatch:
    inputs:
      codigos:
        description: "Códigos Vista separados por espaço (ex.: 40346 38784)"
        type: string
        required: true

concurrency:
  group: video-imovel
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # O runner ubuntu-latest NAO traz ffmpeg (medido em 2026-08-11 pela
      # ponte-arquivo: exit 127). O comentario do producao.yml dizia o contrario.
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Gerar e publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          chmod +x scripts/video_imovel.sh
          for c in ${{ inputs.codigos }}; do
            echo "=== imóvel $c ==="
            ./scripts/video_imovel.sh "$c"
          done
