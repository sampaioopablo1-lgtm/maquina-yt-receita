name: Autoria — escrever as specs que faltam

# O ciclo da maquina tinha tres pernas e faltava a primeira:
#
#   escrever pauta -> renderizar (frota.yml) -> publicar (frota.yml)
#         ^^^^^^                                  disparado pelo diario.yml
#
# A escrita era a unica etapa humana, uma spec por disparo da rotina horaria.
# No melhor dia isso da 24 pacotes para treze canais, e a meta e 5 por canal —
# 65. Em 20/08/2026, com o teto ja em 5, OITO dos treze canais tinham ZERO spec
# pendente: o teto nunca foi o que segurava a frota, era a escrita.
#
# Este workflow escreve. O `diario.yml` pega o que ele commitou no ciclo
# seguinte, sem nenhuma ligacao direta entre os dois — a spec no repositorio e
# a interface, como ja era para as specs escritas a mao.
#
# ## O que ele NAO faz
#
# Nao publica nada e nao renderiza nada. Ele so escreve `.json` em
# `fabrica/specs/` e commita. Toda trava que ja existia continua no caminho:
# os sete portoes do `prontidao.py`, o teto por canal do `orquestra.py`, a
# trava de titulo do `publicar.py`.
#
# E nao libera roteiro sem numero conferido. `autor.py` chama o `fatos.py`
# antes de gravar, e spec reprovada vira `.json.reprovado`, que a frota nao le.
# Essa e a condicao inteira sob a qual escrita automatica e aceitavel nestes
# canais: `labtreinamento` fala de norma com prazo, `sx-educacao` e
# `next-level-money` de dinheiro, `seja-mais-magra` de saude.
#
# ## O custo, que e novo nesta maquina
#
# Ate aqui um pacote custava CPU de runner. Agora custa dolar de API, e a conta
# escala com a meta. Por isso `pacotes` tem default BAIXO e o job imprime o
# gasto de cada geracao: os primeiros dias servem para MEDIR o custo por
# pacote, e so depois se decide o ritmo. Subir esse numero antes de ter a
# medida seria escolher o ritmo no escuro.

on:
  schedule:
    # De duas em duas horas. O ritmo real quem define e `pacotes`, nao o cron:
    # com o default de 1, isto sao 12 specs por dia, o suficiente para a frota
    # nao secar enquanto o custo por pacote esta sendo medido.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      pacotes:
        description: "Quantas specs escrever neste disparo"
        type: string
        default: "1"
      canal:
        description: "Forcar um canal (vazio = o mais carente da fila)"
        type: string
        default: ""
      pauta:
        description: "Forcar uma pauta (so faz sentido com um canal)"
        type: string
        default: ""

# Duas autorias ao mesmo tempo escreveriam o MESMO numero de pacote para o
# mesmo canal — `proximo_numero` le o diretorio, e o diretorio so muda depois
# do commit. Fila de um, sem cancelar: a segunda espera e escreve com o
# diretorio ja atualizado.
concurrency:
  group: autoria
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  escrever:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `fabrica/` e stdlib pura de proposito — nem o autor nem o portao de
      # fatos instalam nada. O `fonts-noto-core` entra porque o portao de
      # glifos reprova caractere sem fonte NESTA maquina, e sem Devanagari o
      # agla-level seria reprovado por defeito do ambiente.
      - name: Fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core

      # A chave morre AQUI, e nao la dentro do laco. No primeiro disparo real
      # (run 32349960529, 20/08/2026) o segredo nao existia no repositorio, o
      # `autor.py` falhou por canal, o `|| true` do laco engoliu o codigo de
      # saida, e o job terminou VERDE em 31 segundos sem escrever nada. Um cron
      # nesse estado esvazia a frota por uma semana sem nunca acender uma luz.
      - name: Conferir a chave da API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY nao esta nos segredos do repositorio. A escrita automatica nao roda sem ela: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Escrever
        id: escrever
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          N: ${{ inputs.pacotes || '1' }}
          CANAL: ${{ inputs.canal }}
          PAUTA: ${{ inputs.pauta }}
        run: |
          # `set +e` de PROPOSITO, e nao por descuido: o shell padrao do runner
          # e `bash -e`, e com ele um canal que falha aborta o passo inteiro e
          # os outros doze nem sao tentados. Aqui cada canal e tentado e o
          # codigo de saida vira MOTIVO, nao fim de execucao. O que decide o
          # resultado do passo e a contagem no fim, nao o ultimo comando.
          set +e -uo pipefail

          if [ -n "$CANAL" ]; then
            FILA="$CANAL 1"
          else
            FILA=$(python3 fabrica/autor.py carencia)
            CARENCIA=$?
            if [ "$CARENCIA" = "3" ]; then
              # Ha canal precisando de spec e NENHUM com pauta em banco. Nao e
              # fila cheia, e o estado oposto: a frota vai secar, e quem age e
              # a pesquisa da rotina horaria, nao este workflow.
              echo "::warning::Ha canais com carencia de spec e nenhum com pauta em banco. A frota vai secar. Quem enche o banco de pautas e o PASSO 0 da rotina horaria (YOUTUBE_SEARCH + confirmacao em fonte institucional), gravando em videos com status='ideia'."
              echo "escritas=0" >> "$GITHUB_OUTPUT"
              echo "carentes=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CARENCIA" != "0" ]; then
              echo "::error::nao consegui ler a carencia do banco — sem isso o disparo escolheria canal no escuro"
              exit 1
            fi
          fi

          if [ -z "$FILA" ]; then
            echo "::notice::Nenhum canal com carencia de spec — a fila esta cheia."
            echo "escritas=0" >> "$GITHUB_OUTPUT"
            echo "carentes=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "carencia por canal:"
          echo "$FILA"
          echo

          ESCRITAS=0
          CARENTES=0
          MOTIVOS=""
          # Um canal por vez, na ordem da carencia, ate fechar a cota do
          # disparo. Escrever DOIS pacotes seguidos para o mesmo canal e
          # possivel, mas nao aqui: o segundo nao veria o primeiro no acervo
          # de similaridade, porque a similaridade le o que ja foi ao ar.
          while read -r SLUG FALTAM; do
            [ -z "${SLUG:-}" ] && continue
            CARENTES=$((CARENTES+1))
            [ "$ESCRITAS" -ge "$N" ] && continue
            echo "::group::$SLUG (faltam $FALTAM)"
            if [ -n "$PAUTA" ]; then
              python3 fabrica/autor.py escrever "$SLUG" --pauta "$PAUTA" > saida.txt 2>&1
            else
              python3 fabrica/autor.py escrever "$SLUG" > saida.txt 2>&1
            fi
            CODIGO=$?
            cat saida.txt
            echo "::endgroup::"
            if [ "$CODIGO" = "0" ]; then
              ESCRITAS=$((ESCRITAS+1))
            else
              MOTIVOS="$MOTIVOS%0A- $SLUG: $(tail -n 1 saida.txt)"
            fi
          done <<< "$FILA"

          echo "escritas=$ESCRITAS" >> "$GITHUB_OUTPUT"
          echo "carentes=$CARENTES" >> "$GITHUB_OUTPUT"

          # Carencia existindo e nada escrito NAO e "nada a fazer": e a frota
          # secando. A diferenca entre um notice e um warning aqui e a
          # diferenca entre alguem descobrir hoje ou na semana que vem.
          if [ "$ESCRITAS" = "0" ]; then
            echo "::warning::$CARENTES canal(is) com carencia de spec e NENHUMA escrita neste disparo:$MOTIVOS"
          fi

      # Reprovada NAO e apagada: ela fica como `.json.reprovado` ao lado, e vai
      # para o commit junto. Apagar em silencio esconderia quanto o gerador
      # erra, que e exatamente o numero que decide se isto continua ligado.
      - name: Commitar as specs novas
        if: ${{ steps.escrever.outputs.escritas != '0' }}
        run: |
          set -euo pipefail
          git config user.name  "maquina-autoria"
          git config user.email "sampaioopablo@gmail.com"
          git add fabrica/specs/
          if git diff --cached --quiet; then
            echo "::warning::o passo disse ter escrito, mas nada mudou no diretorio"
            exit 0
          fi
          NOVAS=$(git diff --cached --name-only | sed 's#.*/##' | tr '\n' ' ')
          git commit -m "autoria: $NOVAS"
          for t in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push falhou, tentativa $t"
            sleep $((2 ** t))
          done

      # `pauta esgotada` e o motivo mais provavel e o mais facil de ler
      # errado: a rotina horaria e quem pesquisa pauta e grava em `videos`
      # como `status='ideia'`. Se ela parou, o gerador nao tem o que escrever
      # — e o sintoma aparece aqui, nao la.
      - name: Nada escrito
        if: ${{ steps.escrever.outputs.escritas == '0' && steps.escrever.outputs.carentes != '0' }}
        run: |
          echo "::notice::Nenhuma spec nova, e ha canal com carencia. O motivo por canal esta no aviso acima. Se for 'nenhuma pauta disponivel', o banco de pautas secou: quem o enche e a pesquisa da rotina horaria (PASSO 0), nao este workflow."
