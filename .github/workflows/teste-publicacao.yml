name: Teste de Publicacao (Ponta a Ponta)

# Valida o caminho completo: ffmpeg -> SQLite -> YouTube API -> Supabase.
# Produz um Short de 3 s em private — nao aparece no canal, pode deletar depois.
on:
  workflow_dispatch:
    inputs:
      privacidade:
        description: "Visibilidade do video de teste"
        type: choice
        options: [private, unlisted]
        default: private

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e .

      - name: Criar video de teste (3s, 1080x1920 SHORTS)
        run: |
          mkdir -p out/teste-pipeline-shorts
          ffmpeg -y \
            -f lavfi -i color=c=black:size=1080x1920:rate=30 \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -t 3 \
            -vf "drawtext=text='Setiap Level':fontsize=100:fontcolor=white:x=(w-text_w)/2:y=(h-text_h)/2-80,\
drawtext=text='Pipeline Test':fontsize=60:fontcolor=gray:x=(w-text_w)/2:y=(h-text_h)/2+40" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest \
            out/teste-pipeline-shorts/final.mp4
          echo "--- arquivo gerado ---"
          ls -lh out/teste-pipeline-shorts/final.mp4

      - name: Registrar video no SQLite
        run: python scripts/criar_video_teste.py

      - name: Verificar registro
        run: maquina listar

      - name: Restaurar credencial do YouTube (setiap-level)
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YT_TOKEN_JSON" > secrets/youtube_token.json
          test -s secrets/youtube_token.json || { echo "ERRO: YT_TOKEN_JSON vazio"; exit 1; }
          echo "Credencial restaurada ($(wc -c < secrets/youtube_token.json) bytes)"

      - name: Publicar no YouTube (private)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          maquina publicar teste-pipeline-shorts \
            --em-horas 0 \
            --privacidade "${{ inputs.privacidade }}" \
            --yes

      - name: Resultado
        run: maquina listar

      - name: Sincronizar com Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: maquina sincronizar

      - name: Limpar credencial
        if: always()
        run: rm -f secrets/youtube_token.json
