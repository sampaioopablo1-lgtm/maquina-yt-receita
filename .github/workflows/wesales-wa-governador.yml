name: WeSales - governador do WhatsApp (max ~15/dia)

# Regra do dono (27/09): WhatsApp automatico espalhado, no maximo ~15 por dia.
# Libera 1-2 leads por rodada da tag wa-aguardando para wa-liberado.
# O agendamento so vale quando este arquivo estiver no branch padrao do repositorio.
on:
  # agendamento movido para wesales-relogio.yml (28/09): o cron do GitHub aqui rodava a cada 3-6 h
  workflow_dispatch:
    inputs:
      aplicar:
        description: "true libera de verdade; false so mostra"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wa-governador
  cancel-in-progress: false

jobs:
  governar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Governador
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.aplicar }}" = "true" ]; then
            python wesales/tools/wa_governador.py --aplicar
          else
            python wesales/tools/wa_governador.py
          fi
