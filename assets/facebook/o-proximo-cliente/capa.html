<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Próximo Cliente — capa do Facebook</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url("fonts/Montserrat-500.ttf") format("truetype"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; src: url("fonts/Montserrat-700.ttf") format("truetype"); }
  @font-face { font-family: "Montserrat"; font-weight: 900; src: url("fonts/Montserrat-900.ttf") format("truetype"); }

  :root {
    --bg: #0B1220;        /* azul-noite: fundo */
    --bg2: #111C33;       /* azul-noite mais claro: gradiente */
    --ink: #FFFFFF;
    --muted: #B7C2D6;
    --accent: #FF7A1A;    /* laranja: energia, anúncio, ação */
    --accent-2: #FFB566;
    --line: rgba(255,255,255,.12);
  }

  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { width: 1640px; height: 624px; overflow: hidden; font-family: "Montserrat", "Liberation Sans", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .capa { position: relative; width: 1640px; height: 624px; overflow: hidden;
    background: radial-gradient(1200px 700px at 78% 45%, var(--bg2) 0%, var(--bg) 60%); }

  /* Grade sutil ao fundo: remete a "painel de anúncios" sem competir com o texto */
  .grade { position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 82px 82px; opacity: .35;
    -webkit-mask-image: radial-gradient(900px 500px at 70% 50%, #000 30%, transparent 100%);
            mask-image: radial-gradient(900px 500px at 70% 50%, #000 30%, transparent 100%); }

  /* Faixa laranja diagonal: o "próximo" — algo chegando */
  .faixa { position: absolute; right: -140px; top: -80px; width: 560px; height: 800px;
    background: linear-gradient(160deg, var(--accent) 0%, #FF5A00 100%);
    transform: skewX(-12deg); }
  .faixa::after { content: ""; position: absolute; left: -26px; top: 0; width: 10px; height: 100%; background: var(--accent-2); opacity: .8; }

  /* Zona segura do celular: 1280 px centrais (o Facebook corta ~180 px de cada lado) */
  .conteudo { position: absolute; left: 180px; top: 0; width: 1280px; height: 624px;
    display: grid; grid-template-columns: 1fr 470px; column-gap: 40px; align-items: center; }

  .rotulo { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 18px; }
  .rotulo::before { content: ""; width: 34px; height: 4px; background: var(--accent); border-radius: 2px; }

  h1 { margin: 0; font-weight: 900; font-size: 92px; line-height: .98; letter-spacing: -.02em; text-transform: uppercase; }
  h1 .destaque { color: var(--accent); }

  .sub { margin: 22px 0 0; font-weight: 500; font-size: 27px; line-height: 1.32; color: var(--muted); max-width: 720px; }
  .sub b { color: var(--ink); font-weight: 700; }

  /* Painel à direita: os três passos e as duas negações */
  .painel { position: relative; background: #0F1A30; border: 1px solid rgba(255,255,255,.18);
    border-radius: 22px; padding: 30px 34px; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .painel .titulo { font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }

  .passos { list-style: none; margin: 0; padding: 0; display: grid; row-gap: 14px; }
  .passos li { display: grid; grid-template-columns: 46px 1fr; align-items: start; column-gap: 16px; font-size: 27px; font-weight: 700; line-height: 1.1; }
  .passos .n { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: #0B1220; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
  .passos .t { padding-top: 6px; }
  .passos li span.t small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-top: 2px; }

  .sem { margin-top: 22px; padding-top: 18px; border-top: 1px dashed rgba(255,255,255,.22); display: flex; gap: 12px; flex-wrap: wrap; }
  .sem span { font-size: 16px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 14px 8px 10px; display: inline-flex; align-items: center; gap: 8px; }
  .sem span::before { content: "✕"; color: var(--accent); font-weight: 900; font-size: 15px; }
</style>
</head>
<body>
<div class="capa">
  <div class="grade"></div>
  <div class="faixa"></div>

  <div class="conteudo">
    <div class="texto">
      <div class="rotulo">Aprenda a anunciar</div>
      <h1>O <span class="destaque">Próximo</span><br>Cliente</h1>
      <p class="sub">Aprenda a divulgar seu próprio negócio e <b>conquistar clientes todos os dias.</b></p>
    </div>

    <aside class="painel">
      <div class="titulo">Do seu jeito, na sua mão</div>
      <ul class="passos">
        <li><span class="n">1</span><span class="t">Você aprende.</span></li>
        <li><span class="n">2</span><span class="t">Você anuncia.</span></li>
        <li><span class="n">3</span><span class="t">Você conquista seus clientes.</span></li>
      </ul>
      <div class="sem">
        <span>Sem depender de agência</span>
        <span>Sem depender de gestor de tráfego</span>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
